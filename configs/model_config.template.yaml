# Model and API Configuration for PaperVizAgent

# Default Models
defaults:
  # Text model for Retriever/Planner/Stylist/Critic and plot-code generation.
  # Examples: "gemini-2.5-flash", "gpt-5.5", "gpt-5.4", "orcarouter/auto"
  model_name: "orcarouter/auto"
  model_provider: "orcarouter"
  # Image model for diagram generation/polishing.
  # Examples: "gemini-3.1-flash-image-preview", "gpt-image-2"
  image_model_name: "gpt-image-2"
  
# API Keys. Fill only the channels you use.
api_keys:
  google_api_key: ""
  openai_api_key: ""
  anthropic_api_key: ""

# AIPAIBOX OpenAI-compatible gateway（国内直连）
aipaibox:
  # Gemini 系列模型通过 AIPAIBOX 调用时使用此 key。
  gemini_api_key: ""
  # GPT/OpenAI 系列模型和 gpt-image-2 通过 AIPAIBOX 调用时使用此 key。
  openai_api_key: ""
  # 兼容旧配置：如果未配置上面两个专用 key，则使用此 key 作为通用 fallback。
  api_key: ""
  base_url: "https://api.aipaibox.com"

# Legacy OpenAI-compatible gateway config. Kept for old deployments.
evolink:
  api_key: ""
  base_url: "https://api.evolink.ai"

# OrcaRouter OpenAI-compatible gateway (Responses API).
# Prefer setting the ORCA_KEY environment variable instead of storing a key here.
orcarouter:
  name: "OrcaRouter"
  api_key: ""
  env_key: "ORCA_KEY"
  base_url: "https://api.orcarouter.ai/v1"
  wire_api: "responses"

# Google Gemini endpoint（可选，支持代理/中转）
# Leave base_url empty to use the official Google Gemini endpoint.
google:
  base_url: ""
  api_version: ""

# OpenAI endpoint（可选，支持代理/中转）
# Leave base_url empty to use the official OpenAI endpoint.
openai:
  base_url: ""
